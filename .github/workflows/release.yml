name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Tag name for releases ("v1.2.3"), "dev" for manual runs. Used in asset file names.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
  WAILS_VERSION: v2.16.0
  NODE_VERSION: "24"

jobs:
  linux:
    name: Linux binary + portable archive
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set version
        run: node packaging/set-version.mjs "$VERSION"

      - name: Build
        run: wails build -clean -tags webkit2_41

      - name: Portable archive
        run: |
          mkdir -p dist/linux-portable
          install -m755 build/bin/mdit dist/linux-portable/mdit
          install -m755 packaging/linux/run-mdit.sh dist/linux-portable/run-mdit.sh
          install -m644 packaging/linux/mdit.desktop dist/linux-portable/mdit.desktop
          install -m644 build/appicon.png dist/linux-portable/appicon.png
          tar -C dist/linux-portable -czf "dist/mdit-${VERSION}-linux-x86_64.tar.gz" .

      - name: Upload binary for packaging jobs
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: build/bin/mdit
          if-no-files-found: error

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-tar
          path: dist/mdit-${{ env.VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: linux-binary
          path: dist/linux

      - name: Build AppImage
        run: |
          appdir=dist/AppDir
          id=io.github.Nilpointer.mdit
          install -Dm755 dist/linux/mdit "$appdir/usr/bin/mdit"
          install -Dm755 packaging/appimage/AppRun "$appdir/AppRun"
          install -Dm644 "packaging/linux/$id.desktop" "$appdir/$id.desktop"
          install -Dm644 "packaging/linux/icons/256x256/$id.png" "$appdir/$id.png"
          install -Dm644 "packaging/linux/icons/256x256/$id.png" "$appdir/usr/share/icons/hicolor/256x256/apps/$id.png"
          ln -s "$id.png" "$appdir/.DirIcon"

          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$appdir" "dist/mdit-${VERSION}-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: release-appimage
          path: dist/mdit-${{ env.VERSION }}-x86_64.AppImage
          if-no-files-found: error

  flatpak:
    name: Linux Flatpak
    needs: linux
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: linux-binary
          path: dist/linux

      - name: Build Flatpak bundle
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          manifest-path: packaging/flatpak/io.github.Nilpointer.mdit.yml
          bundle: mdit-${{ env.VERSION }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          path: mdit-${{ env.VERSION }}-x86_64.flatpak
          if-no-files-found: error

  windows:
    name: Windows installer + portable
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set version
        run: node packaging/set-version.mjs "$VERSION"

      - name: Build
        run: wails build -clean -nsis

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Move-Item build/bin/mdit-amd64-installer.exe "dist/mdit-$env:VERSION-windows-x64-setup.exe"
          Compress-Archive -Path build/bin/mdit.exe -DestinationPath "dist/mdit-$env:VERSION-windows-x64-portable.zip" -Force

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS app (universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set version
        run: node packaging/set-version.mjs "$VERSION"

      - name: Build
        run: wails build -clean -platform darwin/universal

      - name: Package zip and dmg
        run: |
          mkdir -p dist dmg-root
          ditto -c -k --keepParent build/bin/mdit.app "dist/mdit-${VERSION}-macos-universal.zip"
          cp -R build/bin/mdit.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname mdit -srcfolder dmg-root -ov -format UDZO "dist/mdit-${VERSION}-macos-universal.dmg"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, appimage, flatpak, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
